<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
<style>
  /* Gmail-native: same canvas, pill search, rounded white groups, blue accent, tags for senders */
  :root {
    --bg: #f6f8fc; --surface: #ffffff; --fg: #1f1f1f; --muted: #444746; --faint: #747775;
    --line: #e1e3e1; --field: #747775; --chip: #e9eef6; --person: #d3e3fd; --on-person: #041e49; --person-icon: #0842a0;
    --hover: #f2f6fc; --accent: #0b57d0; --on-accent: #ffffff; --tonal: #c2e7ff; --on-tonal: #001d35;
    --danger: #b3261e; --danger-soft: #fce8e6; --on-danger-soft: #8c1d18; --info: #f0f4f9;
    --toast: #303030; --on-toast: #f2f2f2;
    --brand: #ff7a59; --on-brand: #1f1f1f; --on-brand-muted: #4a2216; --brand-field: #fff3ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --surface: #1e1f20; --fg: #e3e3e3; --muted: #c4c7c5; --faint: #8e918f;
      --line: #3c4043; --field: #8e918f; --chip: #2d2f31; --person: #0842a0; --on-person: #d3e3fd; --person-icon: #a8c7fa;
      --hover: #282a2c; --accent: #a8c7fa; --on-accent: #062e6f; --tonal: #004a77; --on-tonal: #c2e7ff;
      --danger: #f2b8b5; --danger-soft: #3c1f1e; --on-danger-soft: #f9dedc; --info: #282a2c;
      --toast: #e3e3e3; --on-toast: #1f1f1f; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/20px Roboto, Arial, sans-serif; }
  button, input, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ms { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; vertical-align: middle; user-select: none; font-weight: 400; font-style: normal; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .icon-btn { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); text-decoration: none; }
  .icon-btn:hover { background: var(--hover); }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; height: 40px; padding: 0 16px; font-weight: 500; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); padding: 0 24px; }
  .btn.text { border-color: transparent; background: none; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }

  /* list view */
  .bar { position: sticky; top: 0; z-index: 2; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 24px; }
  .bar h1 { font: 400 22px/28px Roboto, Arial, sans-serif; margin: 0; }
  .count { color: var(--on-brand-muted); font-size: 13px; }
  .bar .search { background: var(--brand-field); color: var(--on-brand); }
  .bar .search input { color: var(--on-brand); }
  .bar .icon-btn { color: var(--on-brand); }
  .bar .icon-btn:hover { background: rgba(255,255,255,.35); }
  .search { flex: 1 1 260px; max-width: 720px; display: flex; align-items: center; gap: 12px; background: var(--chip); border-radius: 24px; padding: 0 16px; height: 48px; }
  .search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }
  main { padding: 16px 24px 96px; display: flex; flex-direction: column; gap: 16px; max-width: 1100px; }
  .group { background: var(--surface); border-radius: 16px; overflow: hidden; }
  .ghead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; font-weight: 500; }
  .ghead .ms { color: var(--muted); }
  .ghead .n { color: var(--faint); font-weight: 400; font-size: 13px; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .row:hover { background: var(--hover); }
  .crit { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .k { color: var(--muted); font-size: 12px; min-width: 76px; }
  .val { font-size: 13px; overflow-wrap: anywhere; }
  .more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 2px 4px; }
  .tools { display: flex; gap: 2px; }
  .confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--danger-soft); border-radius: 8px; padding: 8px 12px; color: var(--danger); }
  .empty { background: var(--surface); border-radius: 16px; padding: 40px 24px; text-align: center; color: var(--muted); }
  .skel { height: 64px; border-radius: 16px; background: var(--surface); opacity: .6; }

  /* tags */
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--chip); font-size: 13px; max-width: 100%; }
  .tag .ms { font-size: 16px; color: var(--muted); }
  .tag.person { background: var(--person); color: var(--on-person); }
  .tag.person .ms { color: var(--person-icon); }
  .tag .x { width: 24px; height: 24px; margin-right: -6px; border: 0; border-radius: 12px; background: none; display: grid; place-items: center; color: inherit; }
  .tag .x .ms { color: inherit; }
  .tag.bad { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--on-danger-soft); cursor: pointer; }
  .tag.bad .ms { color: var(--on-danger-soft); }
  .tagbox { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 48px; padding: 8px; border: 1px solid var(--field); border-radius: 8px; background: var(--surface); cursor: text; }
  .tagbox:focus-within { border: 2px solid var(--accent); padding: 7px; }
  .tagbox input { flex: 1 1 140px; min-width: 0; height: 28px; border: 0; outline: none; background: none; }
  .hints { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .hints li { display: flex; align-items: center; gap: 6px; }
  .hints .ms { font-size: 16px; }
  .hints b { font-weight: 500; color: var(--fg); }
  .msg { display: flex; gap: 6px; font-size: 12px; line-height: 16px; }
  .msg.err { color: var(--danger); }
  .msg.info { color: var(--muted); background: var(--info); border-radius: 8px; padding: 8px 10px; }
  .msg .ms { font-size: 16px; }

  /* edit view */
  .band { background: var(--brand); color: var(--on-brand); }
  .band-in { max-width: 900px; margin: 0 auto; padding: 14px 28px 18px; display: flex; flex-direction: column; gap: 4px; }
  .band .back { color: var(--on-brand); }
  .band h1 { margin: 0; font: 400 22px/28px Roboto, Arial, sans-serif; }
  .band .sub { color: var(--on-brand-muted); }
  .edit { max-width: 900px; margin: 0 auto; padding: 16px 28px 0; display: flex; flex-direction: column; gap: 24px; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; margin-left: -8px; padding: 6px 8px; border-radius: 16px; color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none; border: 0; background: none; }
  .edit h1 { margin: 0; font: 400 22px/28px Roboto, Arial, sans-serif; }
  .sub { font-size: 13px; color: var(--muted); }
  .sect { display: flex; flex-direction: column; }
  .sect h2 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 6px 24px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
  .flabel { padding-top: 10px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .flabel .n { font-size: 12px; color: var(--faint); }
  .fctl { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fctl > input[type=text] { height: 40px; border: 1px solid var(--field); border-radius: 8px; padding: 0 12px; background: var(--surface); }
  @media (max-width: 640px) { .frow { grid-template-columns: minmax(0, 1fr); } .flabel { padding-top: 0; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type=text] { height: 40px; border: 1px solid var(--field); border-radius: 8px; padding: 0 12px; background: var(--surface); }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 24px; padding-top: 2px; }
  .checks label { display: flex; align-items: center; gap: 12px; min-height: 36px; }
  .checks input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .kept { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
  .foot { position: sticky; bottom: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 0 18px; border-top: 1px solid var(--line); }
  .foot .note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); }

  .sugg { position: absolute; z-index: 4; margin: 0; padding: 6px 0; list-style: none; background: var(--surface); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3); max-height: 288px; overflow-y: auto; }
  .sugg li { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .sugg li .ms { font-size: 18px; color: var(--muted); }
  .sugg li.person .ms { color: var(--person-icon); }
  .sugg li[aria-selected=true], .sugg li:hover { background: var(--hover); }
  .sugg li mark { background: none; color: inherit; font-weight: 500; }
  .toast { position: fixed; left: 24px; bottom: 24px; background: var(--toast); color: var(--on-toast); border-radius: 4px; padding: 14px 16px; max-width: calc(100% - 48px); box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 5; }
  @media (max-width: 600px) { .bar, main { padding-left: 16px; padding-right: 16px; } .edit { padding: 12px 16px 0; } .k { min-width: 0; width: 100%; } }
</style>
</head>
<body>
  <div id="app" aria-live="polite"><main><div class="skel"></div><div class="skel"></div><div class="skel"></div></main></div>
  <ul class="sugg" id="sugg" role="listbox" aria-label="Suggestions" hidden></ul>
  <div class="toast" id="toast" role="status" hidden></div>

<script>
  // Sender parsing, shared with the side panel (served from filters.js so both follow the same rules).
  <?!= shared ?>

  const MAX = 1000;
  let data = null;
  const ui = { view: 'list', open: {}, deleting: null, query: '', edit: null, start: null };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);
  const tagText = (s) => (isDomainSender(s) ? s.slice(1) : s);
  const tagIcon = (s) => (isDomainSender(s) ? 'domain' : 'person');

  function load(then) {
    google.script.run
      .withSuccessHandler((d) => { data = d; (then || render)(); })
      .withFailureHandler((e) => { $('app').innerHTML = '<main><div class="empty">Couldn’t load your filters: ' + esc(e.message) + '</div></main>'; })
      .managerData();
  }

  let toastTimer;
  function toast(text) {
    const t = $('toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 4500);
  }

  function render() { (ui.view === 'edit' ? renderEdit : renderList)(); }

  // ---------- list view ----------

  function matches(f, q) {
    if (!q) return true;
    const hay = [f.summary.title, f.summary.subtitle].concat(f.senders || [], ...f.criteria.map((c) => c.values)).join(' ').toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  }

  function renderList() {
    const q = ui.query.trim().toLowerCase();
    const shown = data.filters.filter((f) => matches(f, q));
    const groups = new Map();
    shown.forEach((f) => { const k = f.summary.title; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); });

    let body;
    if (!data.filters.length) body = '<div class="empty">No filters yet. Create your first one.</div>';
    else if (!shown.length) body = '<div class="empty">No filters match “' + esc(q) + '”.</div>';
    else body = [...groups.keys()].sort((a, b) => a.localeCompare(b)).map((title) => {
      const fs = groups.get(title);
      return '<section class="group"><div class="ghead"><span class="ms" aria-hidden="true">' + esc(fs[0].icon) + '</span><span>' + esc(title) +
        '</span><span class="n">' + fs.length + (fs.length > 1 ? ' filters' : ' filter') + '</span></div>' + fs.map(rowHTML).join('') + '</section>';
    }).join('');

    $('app').innerHTML =
      '<header class="bar"><h1>Your filters</h1><span class="count">' + data.filters.length + ' of ' + MAX.toLocaleString() + '</span>' +
      '<label class="search"><span class="ms" aria-hidden="true">search</span><input id="q" type="search" placeholder="Search senders, words or labels" aria-label="Search filters" value="' + esc(ui.query) + '"></label>' +
      '<button class="icon-btn" data-act="refresh" aria-label="Refresh" title="Refresh"><span class="ms">refresh</span></button>' +
      '<button class="btn primary" data-act="new"><span class="ms" aria-hidden="true">add</span>New filter</button></header>' +
      '<main>' + body + '</main>';
  }

  function rowHTML(f) {
    const lines = [];
    if (f.senders && f.senders.length) {
      const limit = ui.open[f.id] ? Infinity : 6;
      const tags = f.senders.slice(0, limit).map((s) => '<span class="tag' + (isDomainSender(s) ? '' : ' person') + '"><span class="ms" aria-hidden="true">' + tagIcon(s) + '</span>' + esc(tagText(s)) + '</span>').join('');
      const extra = f.senders.length > limit ? '<button class="more" data-act="more" data-id="' + f.id + '">+' + (f.senders.length - limit) + ' more</button>' : '';
      lines.push('<div class="line"><span class="k">From</span>' + tags + extra + '</div>');
    }
    f.criteria.forEach((c) => lines.push('<div class="line"><span class="k">' + esc(c.name) + '</span><span class="val">' + (c.values.map(esc).join(', ') || 'Yes') + '</span></div>'));
    const tail = ui.deleting === f.id
      ? '<div class="confirm">Delete this filter? This can’t be undone. <button class="btn danger" data-act="del-yes" data-id="' + f.id + '">Delete</button><button class="btn" data-act="del-no">Cancel</button></div>'
      : '<div class="tools"><button class="icon-btn" data-act="edit" data-id="' + f.id + '" aria-label="Edit filter" title="Edit"><span class="ms">edit</span></button>' +
        '<button class="icon-btn" data-act="del" data-id="' + f.id + '" aria-label="Delete filter" title="Delete"><span class="ms">delete</span></button></div>';
    return '<div class="row"><div class="crit">' + (lines.join('') || '<span class="val">Any email</span>') + '</div>' + tail + '</div>';
  }

  // ---------- edit view (its own screen, never in place) ----------

  function startEdit(id, from) {
    const f = id && data.filters.find((x) => x.id === id);
    if (id && !f) { ui.view = 'list'; toast('That filter no longer exists.'); render(); return; }
    const v = f ? f.values : { subject: '', to: '', query: '', negatedQuery: '', label: '', actions: [] };
    const seed = from ? parseSenders(from.split(',').join(', '), []) : { added: [] };
    ui.edit = {
      id: f ? f.id : '',
      senders: f ? (f.senders ? f.senders.slice() : null) : seed.added,
      rawFrom: f && !f.senders ? v.from : null,
      values: Object.assign({}, v),
      kept: f ? f.kept : { criteria: [], actions: [] },
      showTo: !!v.to, // To is shown only when the filter uses it; once shown, clearing it must still be saved

      bad: [], messages: [], error: '', saving: false,
    };
    ui.view = 'edit';
    render();
  }

  /** One horizontal row: the label on the left, the control on the right (stacks on narrow screens). */
  const frow = (label, forId, control) =>
    '<div class="frow"><label class="flabel"' + (forId ? ' for="' + forId + '"' : '') + '>' + label + '</label><div class="fctl">' + control + '</div></div>';

  function renderEdit() {
    const E = ui.edit, v = E.values, isNew = !E.id;
    const from = E.senders === null
      ? frow('From', 'e-from', '<input type="text" id="e-from" name="from" value="' + esc(E.rawFrom || '') + '"><span class="sub">This rule uses Gmail search syntax, so it’s edited as text.</span>')
      : frow('From any of these' + (E.senders.length ? ' <span class="n">' + E.senders.length + '</span>' : ''), 'e-add',
          '<div class="tagbox" data-act="focus-add">' +
            E.senders.map((s, i) => '<span class="tag' + (isDomainSender(s) ? '' : ' person') + '"><span class="ms" aria-hidden="true">' + tagIcon(s) + '</span>' + esc(tagText(s)) +
              '<button type="button" class="x" data-act="rm" data-i="' + i + '" aria-label="Remove ' + esc(senderLabel(s)) + '"><span class="ms" aria-hidden="true">close</span></button></span>').join('') +
            E.bad.map((b, i) => '<button type="button" class="tag bad" data-act="fix" data-i="' + i + '" title="Click to fix"><span class="ms" aria-hidden="true">error</span>' + esc(b) + '</button>').join('') +
            '<input id="e-add" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false" placeholder="' + (E.senders.length ? 'Add more' : 'Add address or domain, or paste a list') + '">' +
          '</div>' +
          E.messages.map((m) => '<div class="msg ' + (/^Skipped/.test(m) ? 'info' : 'err') + '"><span class="ms" aria-hidden="true">' + (/^Skipped/.test(m) ? 'info' : 'error') + '</span><span>' + esc(m) + '</span></div>').join('') +
          '<ul class="hints"><li><span class="ms" aria-hidden="true">domain</span><span>Use <b>domain.com</b> to select all emails from the domain</span></li>' +
          '<li><span class="ms" aria-hidden="true" style="color: var(--person-icon)">person</span><span>Use <b>mail@domain.com</b> to add a particular email</span></li>' +
          '<li><span class="ms" aria-hidden="true">keyboard_return</span><span>Enter or a comma adds it. Backspace removes the last one.</span></li></ul>');

    const placeholders = { subject: 'Any subject', query: 'Any words', negatedQuery: 'Nothing excluded', to: 'Anyone' };
    const fields = ['subject', 'query', 'negatedQuery'].concat(E.showTo ? ['to'] : []).map((k) =>
      frow(esc(data.fields[k].replace(/^And the subject contains$/, 'Subject contains')), 'e-' + k,
        '<input type="text" id="e-' + k + '" name="' + k + '" value="' + esc(v[k] || '') + '" placeholder="' + placeholders[k] + '">')).join('');

    const kept = E.kept.criteria.concat(E.kept.actions);
    $('app').innerHTML =
      '<div class="band"><div class="band-in"><button type="button" class="back" data-act="to-list"><span class="ms" aria-hidden="true">arrow_back</span>All filters</button>' +
        '<h1>' + (isNew ? 'New filter' : 'Edit filter') + '</h1><span class="sub">' + (isNew ? 'Add who it’s from, what it does, or both' : 'Saving replaces the filter with the new version') + '</span></div></div>' +
      '<form class="edit" id="editForm" novalidate>' +
        '<section class="sect"><h2>Match emails</h2>' + from + fields + '</section>' +
        '<section class="sect"><h2>Then</h2>' +
          frow('Apply label', 'e-label', '<input type="text" id="e-label" name="label" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false" value="' + esc(v.label || '') + '" placeholder="Pick one or type a new name">') +
          frow('Also', '', '<div class="checks">' + data.actions.map((a) => '<label><input type="checkbox" name="actions" value="' + a.key + '"' + ((v.actions || []).includes(a.key) ? ' checked' : '') + '> ' + esc(a.title) + '</label>').join('') + '</div>') +
          (kept.length ? frow('<span class="ms" aria-hidden="true" style="font-size:16px">lock</span> Kept as is', '', '<div class="kept">' + kept.map((k) => '<span class="tag">' + esc(k) + '</span>').join('') + '<span class="sub" style="flex-basis:100%">This form doesn’t edit these, and saving won’t change them.</span></div>') : '') +
        '</section>' +
        (E.error ? '<div class="msg err" role="alert"><span class="ms" aria-hidden="true">error</span><span>' + esc(E.error) + '</span></div>' : '') +
        '<div class="foot"><span class="note"><span class="ms" aria-hidden="true" style="font-size:16px">sync</span>The side panel refreshes when you close this window</span>' +
        '<span style="display:flex;gap:8px"><button type="button" class="btn text" data-act="to-list">Cancel</button><button type="submit" class="btn primary"' + (E.saving ? ' disabled' : '') + '>' + (E.saving ? 'Saving…' : isNew ? 'Create filter' : 'Save changes') + '</button></span></div>' +
      '</form>';
  }

  /** Keeps what's typed in the form fields, since the edit view is redrawn on every tag change. */
  function captureValues() {
    const form = $('editForm'); if (!form) return;
    const v = ui.edit.values;
    ['subject', 'query', 'negatedQuery', 'to', 'label'].forEach((k) => { if (form[k]) v[k] = form[k].value; });
    if (form.from) ui.edit.rawFrom = form.from.value;
    v.actions = [...form.querySelectorAll('input[name=actions]:checked')].map((x) => x.value);
  }

  function commitAdd(text) {
    const E = ui.edit;
    if (!text.trim()) return false;
    const r = parseSenders(text, E.senders);
    E.senders = E.senders.concat(r.added);
    E.bad = E.bad.concat(r.bad);
    E.messages = r.messages;
    return true;
  }

  function redrawEdit(focusAdd) {
    captureValues(); renderEdit();
    if (focusAdd && $('e-add')) $('e-add').focus();
  }

  // ---------- autocomplete: senders from your other filters, and your labels ----------

  const sg = { input: null, items: [], active: -1 };

  function knownSenders() {
    const all = new Set();
    data.filters.forEach((f) => (f.senders || []).forEach((s) => all.add(s)));
    return [...all].sort((a, b) => tagText(a).localeCompare(tagText(b)));
  }

  /** What the field is currently typing: for the tag field, only the text after the last comma. */
  const sgQuery = (input) => (input.id === 'e-add' ? input.value.split(/[,;\n|]/).pop() : input.value).trim().toLowerCase().replace(/^\*?@/, '');

  function showSugg(input) {
    let items;
    if (input.id === 'e-add') items = knownSenders().filter((s) => !ui.edit.senders.includes(s)).map((s) => ({ value: s, text: tagText(s), icon: tagIcon(s), person: !isDomainSender(s) }));
    else if (input.id === 'e-label') items = data.labels.map((l) => ({ value: l, text: l, icon: 'label' }));
    else return hideSugg();
    const q = sgQuery(input);
    // Senders are suggested only while typing: focus returns to this field after every added tag, and an open list would cover the form.
    if (input.id === 'e-add' && !q) return hideSugg();
    items = items.filter((x) => !q || x.text.toLowerCase().includes(q));
    if (input.id === 'e-label' && items.length === 1 && items[0].text === input.value) items = [];
    sg.input = input; sg.items = items.slice(0, 8); sg.active = -1;
    const box = $('sugg');
    if (!sg.items.length) return hideSugg();
    box.innerHTML = sg.items.map((x, i) => {
      const t = esc(x.text), at = q ? x.text.toLowerCase().indexOf(q) : -1;
      const shown = at < 0 ? t : esc(x.text.slice(0, at)) + '<mark>' + esc(x.text.slice(at, at + q.length)) + '</mark>' + esc(x.text.slice(at + q.length));
      return '<li role="option" id="sg-' + i + '" data-i="' + i + '" aria-selected="false"' + (x.person ? ' class="person"' : '') + '><span class="ms" aria-hidden="true">' + x.icon + '</span>' + shown + '</li>';
    }).join('');
    const r = input.getBoundingClientRect(), anchor = input.closest('.tagbox') || input;
    const a = anchor.getBoundingClientRect();
    box.style.left = a.left + window.scrollX + 'px';
    box.style.top = r.bottom + window.scrollY + 4 + 'px';
    box.style.width = a.width + 'px';
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }

  function hideSugg() {
    $('sugg').hidden = true;
    if (sg.input) { sg.input.setAttribute('aria-expanded', 'false'); sg.input.removeAttribute('aria-activedescendant'); }
    sg.items = []; sg.active = -1;
  }

  function moveSugg(step) {
    sg.active = (sg.active + step + sg.items.length) % sg.items.length;
    [...$('sugg').children].forEach((li, i) => li.setAttribute('aria-selected', String(i === sg.active)));
    sg.input.setAttribute('aria-activedescendant', 'sg-' + sg.active);
    $('sg-' + sg.active).scrollIntoView({ block: 'nearest' });
  }

  function pickSugg(i) {
    const x = sg.items[i], input = sg.input;
    hideSugg();
    if (input.id === 'e-label') { input.value = x.value; ui.edit.values.label = x.value; return; }
    // Tag field: whatever was typed before the last comma is still added, then the picked sender.
    const before = input.value.split(/[,;\n|]/).slice(0, -1).join(',');
    input.value = '';
    commitAdd((before ? before + ',' : '') + x.value);
    redrawEdit(true);
  }

  document.addEventListener('focusin', (ev) => { if (ev.target.id === 'e-add' || ev.target.id === 'e-label') showSugg(ev.target); });
  document.addEventListener('focusout', (ev) => { if (ev.target === sg.input) setTimeout(() => { if (document.activeElement !== sg.input) hideSugg(); }, 0); });
  document.addEventListener('input', (ev) => { if (ev.target.id === 'e-add' || ev.target.id === 'e-label') showSugg(ev.target); });
  $('sugg').addEventListener('mousedown', (ev) => {
    ev.preventDefault(); // keep focus in the field
    const li = ev.target.closest('li'); if (li) pickSugg(Number(li.dataset.i));
  });
  window.addEventListener('resize', hideSugg);

  document.addEventListener('keydown', (ev) => {
    if (sg.items.length && ev.target === sg.input) {
      if (ev.key === 'ArrowDown') { ev.preventDefault(); moveSugg(1); return; }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); moveSugg(-1); return; }
      if (ev.key === 'Escape') { ev.preventDefault(); hideSugg(); return; }
      if ((ev.key === 'Enter' || ev.key === 'Tab') && sg.active >= 0) { ev.preventDefault(); pickSugg(sg.active); return; }
    }
    if (ev.target.id === 'e-label' && ev.key === 'Enter') ev.preventDefault(); // Enter in the label field shouldn't submit the form
    if (ev.target.id !== 'e-add') return;
    const input = ev.target;
    if (ev.key === 'Enter' || ev.key === ',') {
      ev.preventDefault();
      const text = input.value; input.value = '';
      if (commitAdd(text)) redrawEdit(true);
    } else if (ev.key === 'Backspace' && !input.value && ui.edit.senders.length) {
      ui.edit.senders.pop(); ui.edit.messages = []; redrawEdit(true);
    }
  });
  document.addEventListener('paste', (ev) => {
    if (ev.target.id !== 'e-add') return;
    ev.preventDefault();
    const text = (ev.clipboardData || window.clipboardData).getData('text');
    if (commitAdd(ev.target.value + ' ' + text)) redrawEdit(true);
  });
  document.addEventListener('focusout', (ev) => {
    // Typing then clicking elsewhere still adds what was typed (but not when clicking a tag's own buttons).
    if (ev.target.id !== 'e-add' || !ev.target.value.trim()) return;
    if (ev.relatedTarget && ev.relatedTarget.closest('.tagbox, button[type=submit]')) return;
    const text = ev.target.value; ev.target.value = '';
    if (commitAdd(text)) redrawEdit(false);
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'q') { ui.query = ev.target.value; renderList(); const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  });

  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case 'refresh': load(); return;
      case 'new': startEdit(null, ''); return;
      case 'edit': startEdit(id); return;
      case 'more': ui.open[id] = true; renderList(); return;
      case 'del': ui.deleting = id; renderList(); return;
      case 'del-no': ui.deleting = null; renderList(); return;
      case 'del-yes':
        b.disabled = true;
        google.script.run
          .withSuccessHandler((msg) => { ui.deleting = null; toast(msg); load(); })
          .withFailureHandler((e) => { ui.deleting = null; toast('Couldn’t delete the filter: ' + e.message); renderList(); })
          .managerDelete(id);
        return;
      case 'to-list': ui.view = 'list'; ui.edit = null; renderList(); return;
      case 'focus-add': if (ev.target === b && $('e-add')) $('e-add').focus(); return;
      case 'rm': ui.edit.senders.splice(Number(b.dataset.i), 1); ui.edit.messages = []; redrawEdit(true); return;
      case 'fix': {
        // A red tag goes back into the field to be corrected.
        const text = ui.edit.bad.splice(Number(b.dataset.i), 1)[0];
        ui.edit.messages = []; redrawEdit(true);
        $('e-add').value = text; return;
      }
    }
  });

  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const E = ui.edit;
    const pending = $('e-add') ? $('e-add').value : '';
    if (pending.trim()) { $('e-add').value = ''; commitAdd(pending); }
    captureValues();
    if (E.bad.length) { E.error = 'Fix or remove the red entries first.'; renderEdit(); return; }
    const v = E.values;
    const spec = { subject: v.subject.trim(), query: (v.query || '').trim(), negatedQuery: (v.negatedQuery || '').trim(), label: v.label.trim(), actions: v.actions };
    if (E.showTo) spec.to = (v.to || '').trim();
    if (E.senders === null) spec.from = (E.rawFrom || '').trim(); else spec.senders = E.senders;
    E.error = ''; E.saving = true; renderEdit();
    google.script.run
      .withSuccessHandler((msg) => { toast(msg); ui.view = 'list'; ui.edit = null; load(); })
      .withFailureHandler((e) => { E.saving = false; E.error = e.message.replace(/^Exception: /, '').replace(/^Error: /, ''); renderEdit(); })
      .managerSave(E.id, spec);
  });

  // Opened from the side panel: ?view=edit&id=… or ?view=new&from=a@x.com,@y.com
  google.script.url.getLocation((loc) => {
    const p = loc.parameter || {};
    load(() => {
      if (p.view === 'edit' && p.id) startEdit(p.id);
      else if (p.view === 'new') startEdit(null, p.from || '');
      else render();
    });
  });
</script>
</body>
</html>
